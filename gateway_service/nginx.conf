server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://frontend:8080/;

        # Standard headers to ensure the app knows the real user IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. Auth Service Route
    # Requests to http://localhost/auth/... go here
    location /auth/ {
        # 'auth-service' is the name of the container in docker-compose
        proxy_pass http://auth-service:5000/;
        
        # Standard headers to ensure the app knows the real user IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users/ {
        # 'auth-service' is the name of the container in docker-compose
        proxy_pass http://users-service:5000/getusers;
        
        # Standard headers to ensure the app knows the real user IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        add_header Content-Type text/html;
        return 200 '<html><body><h1>Server Health Status: OK</h1></body></html>';
    }
}
