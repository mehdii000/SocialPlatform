services:
  adminer:
    image: adminer
    restart: always
    ports:
      - 5111:8080
    networks:
      - app-network
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000" # Minio Media Port
      - "9001:9001" # Web UI Console Port
    env_file:
      - ./.env.local
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mehdi
      POSTGRES_DB: postgres 
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s # Gives the DB time to initialize before starting checks
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=auth_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/auth_db
    env_file:
      - ./.env.local
    volumes:
      - ./auth_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   # USE LOCALHOST HERE for faster internal pings
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 1s
    networks:
      - app-network

  users-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=users_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/social_db
    env_file:
      - ./.env.local
    volumes:
      - ./users_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 1s
    networks:
      - app-network

  posts-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=posts_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/social_db
    env_file:
      - ./.env.local
    volumes:
      - ./posts_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 1s
    networks:
      - app-network

  messages-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=messages_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/social_db
    env_file:
      - ./.env.local
    volumes:
      - ./messages_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
  
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_HOST_URL=${HOST_URL}
    env_file:
      - ./.env.local
    environment:
      - VITE_HOST_URL=${HOST_URL}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway_service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
      posts-service:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
