services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mehdi
      POSTGRES_DB: postgres 
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s # Gives the DB time to initialize before starting checks
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=auth_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/auth_db
    volumes:
      - ./auth_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   # USE LOCALHOST HERE for faster internal pings
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 1s
    networks:
      - app-network

  users-service:
    build:
      context: .
      dockerfile: GenericPyService.Dockerfile
      args:
        - SERVICE_DIR=users_service
    environment:
      - DATABASE_URL=postgresql://user:mehdi@db:5432/users_db
    volumes:
      - ./users_service/app:/app
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 1s
    networks:
      - app-network

  # Removed healthcheck from Frontend/Gateway as they are "leaf" services
  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway_service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
