services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_DB_URL: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_PORT: "8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - backend

  users-service:
    build:
      context: ./users_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      USERS_DB_URL: ${USERS_DB_URL}
      USERS_SERVICE_PORT: "8002"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - backend

  posts-service:
    build:
      context: ./posts_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTS_DB_URL: ${POSTS_DB_URL}
      POSTS_SERVICE_PORT: "8003"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_POSTS: ${MINIO_BUCKET_POSTS:-post-images}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - backend

  messages-service:
    build:
      context: ./messages_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MESSAGES_DB_URL: ${MESSAGES_DB_URL}
      MESSAGES_SERVICE_PORT: "8004"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - backend

  gateway:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      GATEWAY_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8001
      USERS_SERVICE_URL: http://users-service:8002
      POSTS_SERVICE_URL: http://posts-service:8003
      MESSAGES_SERVICE_URL: http://messages-service:8004
      MINIO_URL: http://minio:9000
      FRONTEND_URL: http://frontend:3000
    depends_on:
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      posts-service:
        condition: service_healthy
      messages-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:

networks:
  backend:
    driver: bridge
